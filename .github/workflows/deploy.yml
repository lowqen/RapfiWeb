name: deploy

# **GitHub Pages 로 낸다.**
#
# W0 이후 COOP/COEP 가 필요 없어져서(배포 경로가 단일 스레드 변형이다) 커스텀 헤더를
# 못 넣는 호스팅도 후보가 됐고, 그래서 비밀값이 하나도 필요 없는 Pages 를 고른다.
# 나중에 멀티스레드를 되살리면(W0c) 그때는 헤더가 필요해지므로 Cloudflare/Vercel 로
# 옮겨야 한다 — 그 경로도 아래에 남겨 두었다.
#
# ## 처음 한 번 해야 하는 것
#
#   저장소 Settings ▸ Pages ▸ Source 를 "GitHub Actions" 로 바꾼다.
#   (private 저장소에서 Pages 를 쓰려면 유료 플랜이 필요하다. 안 되면 저장소를
#    public 으로 바꾸거나 target 을 cloudflare 로 돌린다.)
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "spike/**"
      - "tools/**"
      - ".github/workflows/w0-*.yml"
      - ".github/workflows/tone-dump.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "배포 대상"
        default: "github-pages"
        type: choice
        options: ["github-pages", "artifact-only", "cloudflare"]

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 하나씩. 앞선 배포를 취소하지는 않는다 — 반쯤 올라간 상태로 끝나는 것이
# 제일 나쁘다.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  TARGET: ${{ inputs.target || 'github-pages' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      # Pages 는 저장소 이름이 경로에 붙는다: https://lowqen.github.io/RapfiWeb/
      # vite 의 base 와 라우터의 basename 이 둘 다 이 값을 본다.
      - name: 빌드
        run: pnpm build
        env:
          RAPFIWEB_BASE: ${{ env.TARGET == 'github-pages' && '/RapfiWeb/' || '/' }}

      # Pages 에는 _redirects 가 없다. 딥링크(/research/review)를 새로고침하면
      # 404 로 가므로, 404 페이지를 index.html 로 두어 SPA 가 라우팅을 이어받게 한다.
      - name: SPA 폴백 (404.html)
        if: env.TARGET == 'github-pages'
        run: cp dist/index.html dist/404.html

      # 엔진 산출물과 가중치는 저장소에 없다(계획서 §8). 릴리스 자산에서 받아
      # dist 에 조립하는 자리가 여기다 — W3 에서 채운다.
      - name: 엔진·가중치 조립
        run: |
          echo "TODO(W3): 릴리스 자산에서 rapfi-*.{js,wasm,data} 와 *.bin.lz4 를 받아"
          echo "          dist/engine/ · dist/weights/ 에 놓는다."
          ls -la dist | sed 's/^/  /'

      # 배포 직전 마지막 관문. 앱의 릴리스 게이트와 같은 발상이고 웹에서는 더 중요하다:
      # 앱은 실수로 포함해도 기기에 머물지만 웹은 그 순간 「온라인 시스템에 게시」가 된다.
      - name: RenjuNet 오염 게이트
        run: |
          if find dist -iname '*.rif' -o -iname '*.pack' -o -iname 'freq_data.json' \
                       -o -iname 'renju*.sqlite' | grep -q .; then
            echo "::error::RenjuNet 파생 자료가 배포물에 있습니다 — 라이선스 위반. 중단."
            exit 1
          fi
          echo "깨끗합니다."

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Pages 아티팩트 업로드
        if: env.TARGET == 'github-pages'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Cloudflare Pages
        if: env.TARGET == 'cloudflare'
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 이 없습니다. 저장소 Secrets 에 넣어 주세요."
            exit 1
          fi
          pnpm dlx wrangler@3 pages deploy dist --project-name rapfiweb
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  pages:
    if: ${{ (inputs.target || 'github-pages') == 'github-pages' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
