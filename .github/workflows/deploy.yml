name: deploy

# **Cloudflare Pages 로 낸다.**
#
# ## 처음 한 번 해야 하는 것 (자세히는 docs/배포-cloudflare.md)
#
#   1. API 토큰을 만든다: My Profile ▸ API Tokens ▸ Create Token ▸
#      템플릿 없이 "Account ▸ Cloudflare Pages ▸ Edit" 권한 하나만.
#   2. 이 저장소 Settings ▸ Secrets and variables ▸ Actions 에 넣는다:
#        CLOUDFLARE_API_TOKEN
#        CLOUDFLARE_ACCOUNT_ID   (대시보드 우측 사이드바의 Account ID)
#
# Pages 프로젝트는 **이 워크플로가 없으면 만든다** — 대시보드에서 미리 만들 필요 없다.
#
# Cloudflare Pages 는 도메인 루트에서 서빙하므로 base 는 "/" 다(GitHub Pages 와
# 다른 점). `public/_headers` 와 `public/_redirects` 도 그대로 읽어 준다 —
# 그래서 SPA 딥링크가 별도 설정 없이 동작한다.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "spike/**"
      - "tools/**"
      - "bench/**"
      - ".github/workflows/bench-*.yml"
      - ".github/workflows/n1-*.yml"
      - ".github/workflows/tone-dump.yml"
      - ".github/workflows/engine-release.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "배포 대상"
        default: "cloudflare"
        type: choice
        options: ["cloudflare", "artifact-only"]

permissions:
  contents: read

# 배포는 하나씩. 앞선 배포를 취소하지는 않는다 — 반쯤 올라간 상태로 끝나는 것이
# 제일 나쁘다.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  TARGET: ${{ inputs.target || 'cloudflare' }}
  PROJECT: rapfiweb
  # src/engine/engine-manifest.json 의 tag 와 같아야 한다(verify-engine.ts 가 본다).
  ENGINE_TAG: engine-3c94c2a9-w8
  # 배포 토큰을 쥐는 도구라 정확한 판으로 고정한다(보안 강화 계획 F4). 3.x 의 마지막 판(legacy 태그).
  WRANGLER: wrangler@3.114.17

jobs:
  build:
    # GitHub 호스트 러너(보안 강화 계획 Phase 2) — 배포 토큰을 쥐는 잡이라 남과 나눠 쓰는 기계에 두지 않는다.
    # 예전의 저장소 변수 CI_RUNNER(self-hosted 우회)는 없앴다.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # 엔진 쇼케이스(showcase/) — 앱과 따로 빌드해 같은 배포의 /showcase/ 에 싣는다. 앱 번들 · 라우팅과 섞이지 않는다
      # (정적 파일이 SPA 폴백보다 먼저 나간다). 타입 검사는 위 pnpm build 의 tsc 가 showcase 까지 이미 했다.
      - name: 쇼케이스 빌드 (/showcase/)
        env:
          SHOWCASE_BASE: /showcase/
          SHOWCASE_OUT: dist/showcase
        run: |
          pnpm exec vite build --config showcase/vite.config.ts
          test -f dist/showcase/index.html

      # 엔진 산출물 조립. .js/.wasm 은 저장소에 있고 가중치(rapfi.data, 모든 변형 공유)만
      # 릴리스에서 받는다(계획서 §8). 릴리스는 engine-release.yml 이 만든다. 커밋된 매니페스트
      # ·글루와 짝이 아니면 **배포하지 않는다** — 앱의 가중치 무결성 검사가 전원 실패한다.
      #
      # **엔진 없이는 배포하지 않는다.** 예전에는 `gh release view` 가 어떤 까닭으로든 실패하면 「릴리스가 없다」로
      # 읽고 경고만 남긴 채 엔진 없는 dist 를 올렸다 — gh 가 없던 RunPod 러너에서 실제로 그렇게 나가, 프로덕션이
      # 엣지 캐시가 남은 곳에서만 엔진을 띄웠다(deploy 37325146041). 받지 못하면 여기서 멈춘다.
      - name: 엔진 조립
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/engine
          # gh 가 없는 self-hosted 러너(c4)에서도 받게 — tools/ci/release-download.mjs(gh 없으면 REST · 일시적 실패 재시도)
          node tools/ci/release-download.mjs "$ENGINE_TAG" dist/engine 'rapfi-*.js' 'rapfi-*.wasm' 'rapfi.data' 'engine-manifest.json' \
            || { echo "::error::엔진 릴리스 $ENGINE_TAG 를 받지 못했습니다 — 엔진 없이 배포하지 않습니다."; exit 1; }
          echo '{ "type": "commonjs" }' > dist/engine/package.json
          ls -la dist/engine | sed 's/^/  /'
          pnpm exec tsx scripts/verify-engine.ts

      # 소스맵 — `build.sourcemap: "hidden"` 이라 .map 은 만들되 번들에 주석으로 잇지 않는다. 배포본에서는
      # 빼고(보안 강화 계획 F2) 프로덕션 오류 스택을 맞춰 볼 수 있게 CI 아티팩트로만 90일 둔다.
      - name: 소스맵 분리
        run: |
          mkdir -p sourcemaps
          (cd dist && find . -name '*.map' -exec cp --parents {} ../sourcemaps/ \;)
          find dist -name '*.map' -delete
          echo "소스맵 $(find sourcemaps -name '*.map' | wc -l)개를 배포본에서 뺐습니다."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: sourcemaps-${{ github.sha }}
          path: sourcemaps/
          if-no-files-found: warn
          retention-days: 90

      - name: 소스맵 게이트
        run: |
          if find dist -name '*.map' | grep -q .; then
            echo "::error::배포물에 .map 이 남아 있습니다."; find dist -name '*.map'; exit 1
          fi
          if grep -rl --include='*.js' 'sourceMappingURL=' dist | grep -q .; then
            echo "::error::sourceMappingURL 주석이 남은 번들이 있습니다."; grep -rl --include='*.js' 'sourceMappingURL=' dist; exit 1
          fi
          echo "깨끗합니다."

      # 배포 직전 마지막 관문. 앱의 릴리스 게이트와 같은 발상이고 웹에서는 더 중요하다:
      # 앱은 실수로 포함해도 기기에 머물지만 웹은 그 순간 「온라인 시스템에 게시」가 된다.
      - name: RenjuNet 오염 게이트
        run: |
          if find dist -iname '*.rif' -o -iname '*.pack' -o -iname 'freq_data.json' \
                       -o -iname 'renju*.sqlite' | grep -q .; then
            echo "::error::RenjuNet 파생 자료가 배포물에 있습니다 — 라이선스 위반. 중단."
            exit 1
          fi
          echo "깨끗합니다."

      # 기록용일 뿐 뒤 단계가 받아 쓰지 않는다 — 저장 한도가 차도 배포를 막지 않는다.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 3

      - name: 비밀값 확인
        if: env.TARGET == 'cloudflare'
        run: |
          missing=0
          [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && { echo "::error::CLOUDFLARE_API_TOKEN 이 없습니다"; missing=1; }
          [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] && { echo "::error::CLOUDFLARE_ACCOUNT_ID 가 없습니다"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "저장소 Settings ▸ Secrets and variables ▸ Actions 에 넣어 주세요."
            echo "자세히: docs/배포-cloudflare.md"
            exit 1
          fi
          echo "확인됨."

      - name: Playwright(Chromium) 설치
        if: env.TARGET == 'cloudflare'
        # --with-deps 는 apt(sudo)를 쓴다 — 안 되는 self-hosted 러너면 브라우저만 받는다.
        run: pnpm exec playwright install --with-deps chromium || pnpm exec playwright install chromium

      - name: Cloudflare Pages 배포
        id: cf
        if: env.TARGET == 'cloudflare'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `pnpm dlx` 의 캐시를 **이 실행만의** 자리로. self-hosted 러너는 실행 사이에 홈의
          # pnpm 캐시가 남는데, 반쯤 쓰다 만 wrangler 설치(package.json 없음)가 남자 dlx 가
          # 그 해시 자리를 그대로 다시 써 ENOENT 로 배포가 두 번 연속 죽었다(run 37308697246).
          # 재실행으로는 풀리지 않는다 — 같은 해시 자리다. 매번 새로 받는 값은 몇 초다.
          XDG_CACHE_HOME: ${{ runner.temp }}/deploy-cache
        run: |
          # 프로젝트가 없으면 만든다. 처음에는 대시보드에서 손으로 만들라고 안내했는데,
          # 그러면 「비밀값은 넣었는데 프로젝트가 없어서」 배포가 실패한다 —
          # 실제로 그렇게 한 번 걸렸다(code 8000007 Project not found).
          # 「Pages: Edit」 토큰이면 생성도 되므로 그 단계를 없앤다.
          if pnpm dlx "$WRANGLER" pages project list 2>/dev/null \
               | grep -qE "(^|[[:space:]])${PROJECT}([[:space:]]|$)"; then
            echo "프로젝트 $PROJECT — 있음"
          else
            echo "프로젝트 $PROJECT 가 없어 만듭니다."
            pnpm dlx "$WRANGLER" pages project create "$PROJECT" --production-branch main
          fi

          pnpm dlx "$WRANGLER" pages deploy dist \
            --project-name "$PROJECT" \
            --branch "${{ github.ref_name }}" \
            --commit-dirty=true | tee deploy.log

          # 이 배포만의 주소와 프로덕션 주소를 둘 다 남긴다.
          url=$(grep -oE 'https://[^ ]+\.pages\.dev' deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### 배포 완료"
            echo
            echo "- 이 배포: $url"
            echo "- 프로덕션: https://$PROJECT.pages.dev"
          } >> "$GITHUB_STEP_SUMMARY"

      # 「올라갔다」와 「돈다」는 다르다. 배포된 주소에서 엔진을 실제로 띄워
      # 렌주로 착수·분석·정지까지 한 바퀴 돈다 — CI 안의 dist 가 아니라 CDN 이
      # 내주는 파일로. MIME(.wasm), 캐시 헤더, SPA 폴백이 여기서만 드러난다.
      # 쇼케이스는 엔진이 없는 정적 페이지라 HTTP 로 충분하다 — SPA 폴백(앱 index.html)이 아니라 쇼케이스 문서가,
      # 그 문서가 가리키는 JS · CSS 가 자산(text/html 아님)으로 나가는지.
      - name: 배포 검증 — /showcase/
        if: env.TARGET == 'cloudflare'
        env:
          BASE_URL: ${{ steps.cf.outputs.url }}
        run: |
          set -e
          page=$(curl -fsSL --retry 5 --retry-delay 5 "$BASE_URL/showcase/")
          echo "$page" | grep -q "RapfiWeb 엔진 쇼케이스" || { echo "::error::/showcase/ 가 쇼케이스가 아닙니다(SPA 폴백?)"; exit 1; }
          for a in $(echo "$page" | grep -oE '/showcase/assets/[^"]+\.(js|css)'); do
            ct=$(curl -fsSIL "$BASE_URL$a" | grep -i '^content-type' | tail -1)
            echo "$a — $ct"
            echo "$ct" | grep -qiE 'javascript|css' || { echo "::error::$a 가 자산으로 나가지 않습니다"; exit 1; }
          done
          code=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$BASE_URL/showcase")
          echo "/showcase → $code"
          echo "- 쇼케이스: $BASE_URL/showcase/" >> "$GITHUB_STEP_SUMMARY"

      # 보안 헤더가 **실제 응답**에 붙었는가 — 페이지 · 엔진 워커 스크립트 · 엔진 산출물(docs/보안-강화-계획.md
      # Phase 1). 워커는 자기 응답의 CSP 를 따르므로 워커 스크립트도 본다. 소스맵은 배포본에서 뺐으므로
      # .map 주소는 SPA 폴백(HTML)이 나와야 한다 — 상태 코드가 아니라 내용이 맵인지로 본다.
      - name: 배포 검증 — 보안 헤더 · 소스맵
        if: env.TARGET == 'cloudflare'
        env:
          BASE_URL: ${{ steps.cf.outputs.url }}
        run: |
          set -e
          need() {
            local path=$1; shift
            local h; h=$(curl -fsSI --retry 5 --retry-delay 5 "$BASE_URL$path")
            for name in "$@"; do
              echo "$h" | grep -qi "^$name:" || { echo "::error::$path 에 $name 헤더가 없습니다"; echo "$h"; exit 1; }
            done
            echo "$path — 확인: $*"
          }
          need / content-security-policy cross-origin-opener-policy cross-origin-embedder-policy                  cross-origin-resource-policy x-frame-options strict-transport-security permissions-policy
          curl -fsSI "$BASE_URL/" | grep -i '^content-security-policy:' | grep -q "'wasm-unsafe-eval'"             || { echo "::error::CSP 에 'wasm-unsafe-eval' 이 없습니다 — 엔진이 뜨지 않습니다"; exit 1; }
          index=$(curl -fsSL "$BASE_URL/" | grep -oE '/assets/index-[^"]+\.js' | head -1)
          worker=$(curl -fsSL "$BASE_URL$index" | grep -oE 'assets/engine-worker-[A-Za-z0-9_-]+\.js' | head -1)
          [ -n "$worker" ] || { echo "::error::번들에서 엔진 워커 주소를 찾지 못했습니다"; exit 1; }
          need "/$worker" content-security-policy cross-origin-embedder-policy
          need /engine/rapfi-single-simd128.wasm cross-origin-resource-policy
          if curl -fsSL "$BASE_URL$index.map" 2>/dev/null | head -c 40 | grep -q '"version"'; then
            echo "::error::소스맵이 배포되어 있습니다: $index.map"; exit 1
          fi
          echo "소스맵 없음 확인: $index.map"
          echo "- 보안 헤더 · 소스맵: 확인" >> "$GITHUB_STEP_SUMMARY"

      - name: 배포 검증 — 실제 주소에서 렌주 엔진
        if: env.TARGET == 'cloudflare'
        env:
          SMOKE_BASE_URL: ${{ steps.cf.outputs.url }}
        run: pnpm exec tsx scripts/engine-smoke.ts

      # 분석이 흐르는 것과 **한 판 두는 것**은 다르다. 차례가 오가고, 시계가
      # 줄고, 협상이 끝까지 가고, 기권이 판을 닫는가 — W4 의 검수 항목이다.
      # 단위 시험은 엔진의 답을 우리가 만들어 넣으므로 여기서만 드러나는 것이 있다.
      - name: 배포 검증 — 실제로 한 판 둔다
        if: env.TARGET == 'cloudflare'
        env:
          SMOKE_BASE_URL: ${{ steps.cf.outputs.url }}
        run: pnpm exec tsx scripts/game-smoke.ts
