name: deploy

# **수동 실행만 한다.** 배포는 공개 행위라 main 에 푸시할 때마다 자동으로 나가게 두지
# 않는다 — 저장소가 아직 private 이고, 어디로 낼지도 아직 정하지 않았다.
# 정해지면 아래 push 트리거를 켜면 된다.
#
#   on:
#     push:
#       branches: [main]
#
# ## 어디로 낼 것인가
#
# W0 이후 **COOP/COEP 가 필요 없어졌다**(단일 스레드 배포 경로). 그래서 커스텀 헤더를
# 못 넣는 곳도 후보가 된다:
#
#   github-pages   추가 비밀값이 필요 없다. private 저장소에서는 유료 플랜이 필요하고,
#                  저장소 설정에서 Pages 를 켜 두어야 한다.
#   cloudflare     CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 두 비밀값이 필요하다.
#                  _headers 파일을 그대로 읽어 준다.
#   vercel         VERCEL_TOKEN / ORG / PROJECT.
#
# 지금은 **아무 데도 내지 않고** dist 아티팩트만 만든다. target 을 골라 돌리면
# 그때 그 경로가 켜진다.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "배포 대상"
        default: "artifact-only"
        type: choice
        options: ["artifact-only", "github-pages", "cloudflare"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build

      # 엔진 산출물과 가중치는 저장소에 없다(계획서 §8). 릴리스 자산에서 받아
      # dist 에 조립하는 자리가 여기다 — W3 에서 채운다.
      - name: 엔진·가중치 조립
        run: |
          echo "TODO(W3): 릴리스 자산에서 rapfi-*.{js,wasm,data} 와 *.bin.lz4 를 받아"
          echo "          dist/engine/ · dist/weights/ 에 놓는다."
          ls -la dist | sed 's/^/  /'

      # 배포 직전 마지막 관문. 앱의 릴리스 게이트와 같은 발상이고, 웹에서는 더 중요하다:
      # 앱은 실수로 포함해도 기기에 머물지만 웹은 그 순간 «온라인 시스템에 게시»가 된다.
      - name: RenjuNet 오염 게이트
        run: |
          if find dist -iname '*.rif' -o -iname '*.pack' -o -iname 'freq_data.json' \
                       -o -iname 'renju*.sqlite' | grep -q .; then
            echo "::error::RenjuNet 파생 자료가 배포물에 있습니다 — 라이선스 위반. 중단."
            exit 1
          fi
          echo "깨끗합니다."

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: GitHub Pages 업로드
        if: inputs.target == 'github-pages'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Cloudflare Pages
        if: inputs.target == 'cloudflare'
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 이 없습니다. 저장소 Secrets 에 넣어 주세요."
            exit 1
          fi
          pnpm dlx wrangler@3 pages deploy dist --project-name rapfiweb
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  pages:
    if: inputs.target == 'github-pages'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
