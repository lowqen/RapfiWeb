name: deploy

# **Cloudflare Pages 로 낸다.**
#
# ## 처음 한 번 해야 하는 것 (자세히는 docs/배포-cloudflare.md)
#
#   1. Cloudflare 대시보드 ▸ Workers & Pages ▸ Create ▸ Pages ▸
#      "Direct Upload" 로 프로젝트를 하나 만든다. 이름은 아래 PROJECT 와 같아야 한다.
#   2. API 토큰을 만든다: My Profile ▸ API Tokens ▸ Create Token ▸
#      템플릿 없이 "Account ▸ Cloudflare Pages ▸ Edit" 권한 하나만.
#   3. 이 저장소 Settings ▸ Secrets and variables ▸ Actions 에 넣는다:
#        CLOUDFLARE_API_TOKEN
#        CLOUDFLARE_ACCOUNT_ID   (대시보드 우측 사이드바의 Account ID)
#
# Cloudflare Pages 는 도메인 루트에서 서빙하므로 base 는 "/" 다(GitHub Pages 와
# 다른 점). `public/_headers` 와 `public/_redirects` 도 그대로 읽어 준다 —
# 그래서 SPA 딥링크가 별도 설정 없이 동작한다.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "spike/**"
      - "tools/**"
      - ".github/workflows/w0-*.yml"
      - ".github/workflows/tone-dump.yml"
      - ".github/workflows/engine-release.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "배포 대상"
        default: "cloudflare"
        type: choice
        options: ["cloudflare", "artifact-only"]

permissions:
  contents: read

# 배포는 하나씩. 앞선 배포를 취소하지는 않는다 — 반쯤 올라간 상태로 끝나는 것이
# 제일 나쁘다.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  TARGET: ${{ inputs.target || 'cloudflare' }}
  PROJECT: rapfiweb
  ENGINE_TAG: engine-3c94c2a9

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build

      # 엔진 산출물 조립. .js/.wasm 은 저장소에 있고 .data(40MB)만 릴리스에서 받는다
      # (계획서 §8). 릴리스는 engine-release.yml 이 만든다.
      - name: 엔진 조립
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/engine
          if gh release view "$ENGINE_TAG" > /dev/null 2>&1; then
            gh release download "$ENGINE_TAG" --dir dist/engine \
              --pattern 'rapfi-single-simd128.*' --clobber
            echo '{ "type": "commonjs" }' > dist/engine/package.json
            ls -la dist/engine | sed 's/^/  /'
          else
            echo "::warning::릴리스 $ENGINE_TAG 이 없습니다 — 엔진 없이 배포합니다."
            echo "  engine-release.yml 을 한 번 돌리면 채워집니다."
          fi

      # 배포 직전 마지막 관문. 앱의 릴리스 게이트와 같은 발상이고 웹에서는 더 중요하다:
      # 앱은 실수로 포함해도 기기에 머물지만 웹은 그 순간 「온라인 시스템에 게시」가 된다.
      - name: RenjuNet 오염 게이트
        run: |
          if find dist -iname '*.rif' -o -iname '*.pack' -o -iname 'freq_data.json' \
                       -o -iname 'renju*.sqlite' | grep -q .; then
            echo "::error::RenjuNet 파생 자료가 배포물에 있습니다 — 라이선스 위반. 중단."
            exit 1
          fi
          echo "깨끗합니다."

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: 비밀값 확인
        if: env.TARGET == 'cloudflare'
        run: |
          missing=0
          [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && { echo "::error::CLOUDFLARE_API_TOKEN 이 없습니다"; missing=1; }
          [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] && { echo "::error::CLOUDFLARE_ACCOUNT_ID 가 없습니다"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "저장소 Settings ▸ Secrets and variables ▸ Actions 에 넣어 주세요."
            echo "자세히: docs/배포-cloudflare.md"
            exit 1
          fi
          echo "확인됨."

      - name: Cloudflare Pages 배포
        if: env.TARGET == 'cloudflare'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm dlx wrangler@3 pages deploy dist \
            --project-name "$PROJECT" \
            --branch "${{ github.ref_name }}" \
            --commit-dirty=true
