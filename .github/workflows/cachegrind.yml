name: cachegrind 결정적 비용 지표 (M1)

# docs/최적화-마스터플랜.md 2부 §4 M1 — 같은 러너에서 A(base_patches) · B(+test_patches) 네이티브 128비트 빌드를
# valgrind cachegrind 아래에서 같은 국면 · 같은 노드 상한으로 풀어 명령 수(Ir)와 모의 캐시 미스를 맞댄다.
# Ir 은 실행마다 같아야 한다(보고서의 「결정성」 표) — 순서 효과 · CPU 잡음이 없다.
on:
  workflow_dispatch:
    inputs:
      base_patches:
        description: "기준(A) 패치 — 배포 구성은 P2-2"
        default: "tools/patches/p2-2-keep-evaluators-on-rebuild.patch"
        type: string
      test_patches:
        description: "시험(B)에 더 얹을 패치(비우면 A 만 — 기준선)"
        default: ""
        type: string
      ll_sizes:
        description: "모의 LL 크기(바이트, 2의 거듭제곱, 공백 구분)"
        default: "4194304 33554432"
        type: string
      nodes:
        description: "국면당 노드 상한"
        default: "250000"
        type: string
      count:
        description: "국면 수(묶음 앞에서부터)"
        default: "12"
        type: string
      positions:
        default: "bench/sprt/openings-balanced.json"
        type: string
      runner:
        description: "러너 — ubuntu-latest(기본, GitHub 호스트) 또는 self-hosted"
        default: "ubuntu-latest"
        type: choice
        options: ["ubuntu-latest", "self-hosted"]

permissions:
  contents: read

jobs:
  cachegrind:
    # cachegrind 는 결정적이라 러너가 바뀌어도 Ir 은 같다(벽시계만 다름) — 같은 런 안의 A/B 만 맞댄다.
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300
    env:
      WORK: ${{ github.workspace }}/../rapfi-wasm-work
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26"
      - name: 시스템 도구
        # sprt.yml 과 같은 방식 — 이미 있으면 건너뛰고, 없으면 sudo -n(암호를 묻지 않음)으로 설치를 시도한다.
        run: |
          missing=()
          for t in git cmake ninja g++ ccache valgrind; do command -v "$t" > /dev/null || missing+=("$t"); done
          if [ ${#missing[@]} -eq 0 ]; then echo "도구 모두 있음"; exit 0; fi
          echo "없는 도구: ${missing[*]} — 설치 시도"
          if sudo -n apt-get update -qq && sudo -n apt-get install -y git cmake ninja-build g++ ccache valgrind; then exit 0; fi
          # sudo 가 막힌 self-hosted(c4 등)에서 valgrind 만 빠졌으면: .deb 를 받아(apt-get download — root 불필요) 작업 폴더에
          # 풀어 쓴다. 도구 본체가 실행 파일 옆이 아니라 libexec 에 있어 VALGRIND_LIB 로 알려 준다.
          if [ "${missing[*]}" = "valgrind" ]; then
            vg="$WORK/valgrind-user"
            if [ ! -x "$vg/usr/bin/valgrind" ]; then
              rm -rf "$vg" && mkdir -p "$vg"
              ( cd "$vg" && apt-get download valgrind && dpkg -x valgrind_*.deb . ) \
                || { echo "::error::valgrind .deb 를 받지 못함 — 러너 기계에 직접: sudo apt-get install -y valgrind"; exit 1; }
            fi
            lib=$(ls -d "$vg/usr/libexec/valgrind" "$vg/usr/lib/x86_64-linux-gnu/valgrind" "$vg/usr/lib/valgrind" 2> /dev/null | head -1)
            VALGRIND_LIB="$lib" "$vg/usr/bin/valgrind" --version || { echo "::error::풀어 둔 valgrind 가 돌지 않음"; exit 1; }
            echo "$vg/usr/bin" >> "$GITHUB_PATH"
            echo "VALGRIND_LIB=$lib" >> "$GITHUB_ENV"
            echo "valgrind 를 사용자 공간에서 씀: $vg"
            exit 0
          fi
          echo "::error::설치 실패(sudo 암호?) — 러너 기계에 직접 설치: sudo apt-get install -y git cmake ninja-build g++ ccache valgrind"
          exit 1
      - name: 러너 정보
        run: |
          echo "nproc $(nproc) · $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"
          grep -E 'MemTotal|MemAvailable' /proc/meminfo
      - name: rapfi 소스 캐시 복원
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.WORK }}/rapfi
          key: rapfi-3c94c2a9-v1
      - name: 빌드 · cachegrind · 보고
        env:
          BASE_PATCHES: ${{ inputs.base_patches }}
          TEST_PATCHES: ${{ inputs.test_patches }}
          LL_SIZES: ${{ inputs.ll_sizes }}
          NODES: ${{ inputs.nodes }}
          COUNT: ${{ inputs.count }}
          POSITIONS: ${{ inputs.positions }}
          OUT: bench/cachegrind/results/run
        run: |
          set -o pipefail
          nproc
          bash tools/bench_cachegrind.sh
          {
            echo "### cachegrind — base(\`${BASE_PATCHES}\`) ↔ test(+\`${TEST_PATCHES:-없음}\`)"
            cat "$OUT/report.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 결과
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cachegrind
          retention-days: 14
          path: |
            bench/cachegrind/results/run/*.json
            bench/cachegrind/results/run/*.log
            bench/cachegrind/results/run/*.md
            bench/cachegrind/results/run/*.cgout
            bench/cachegrind/engines/*/ENGINE_VERSION.txt
            bench/cachegrind/engines/*/bench.txt
