name: 엔진 릴리스 (WASM 산출물)

# 계획서 §8 의 산출물 정책을 실행하는 워크플로.
#
#   .js / .wasm   ~1.2MB × 4   저장소에 커밋한다(클론 직후 바로 실행). 여기서는 아티팩트로도 낸다.
#   rapfi.data    ~20MB (렌주 전용, **모든 변형 공유**)   커밋 금지. **릴리스 자산**으로 낸다.
#   engine-manifest.json      공유 가중치의 크기·SHA-256 — src/engine/ 에 커밋한다(앱이 검증에 쓴다)
#
# .data 는 가중치 프리로드다. 이게 없으면 엔진이 config.toml 을 못 찾아 뜨자마자
# 죽으므로, 웹 CI 와 배포는 여기서 만든 릴리스에서 받아 조립한다.
#
# 수동 실행이다 — 엔진 커밋이나 가중치가 바뀔 때만 다시 돌린다.
#
# **네 변형을 한 빌드에서 낸다** — SIMD 멀티·단일과 그 relaxed 판(`-mrelaxed-simd`).
# 앱이 relaxed 지원을 감지해 relaxed 멀티 → 멀티 → relaxed 단일 → 단일 순으로 띄운다
# (engine-client.ts). 커밋된 .js 는 같은 빌드의 .wasm·.data 와 짝이어야 한다(글루에 데이터
# 패키지 목록이 박힌다) — 빌드 스크립트가 네 글루의 목록과 .data 가 모두 같음을 확인하고
# rapfi.data 하나로 낸다. 새 태그로 낸다: 앞 릴리스를 지우고 다시 만드는 사이에 web·deploy 가
# 깨지지 않게.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리스 태그"
        default: "engine-3c94c2a9-rx"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      WORK: ${{ github.workspace }}/../rapfi-wasm-work
      ENABLE_LTO: "ON"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: 시스템 도구
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build ccache file

      # w0-spike.yml 과 같은 키. restore/save 를 따로 쓰는 이유는 그쪽 주석에 있다
      # (한 덩어리 actions/cache 는 잡이 실패하면 저장을 건너뛴다).
      - name: emsdk 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORK }}/emsdk
          key: emsdk-latest-v1

      - name: rapfi 소스 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORK }}/rapfi
          key: rapfi-3c94c2a9-v1

      - name: 빌드 + 검증 게이트
        env:
          EXTRA_VARIANTS: "multi-simd128-relaxed single-simd128-relaxed"
          RELEASE_TAG: ${{ inputs.tag }}
          # P2-6 채택(docs/최적화-마스터플랜.md §4 · §5.3): 결과 불변(BENCH 2b7c7da9 · 렌주 비트 동일)이고
          # 같은 러너 대조 두 번 모두 1 스레드 NPS 개선(+1.20% · +1.56%, 37044975502 · 37044987704).
          WASM_OPT_POST: "-O4 --converge"
        run: bash tools/build_engine_wasm.sh

      - name: 웹 회귀 게이트 (single-simd128)
        run: node spike/node-bench.mjs single-simd128

      # relaxed 명령은 명세상 **구현 정의**다. 노드 22+ 는 relaxed 를 기본으로 읽고, 노드 26 은
      # 예전 플래그 `--experimental-wasm-relaxed-simd` 를 `bad option` 으로 거부한다 — 붙이지 않는다.
      #   - BENCH 는 **기록만** 한다. 렌주 전용 .data 의 BENCH 는 국면 7/10 이 classical 폴백으로
      #     도는데 그 경로가 relaxed 에서 **러너마다** 다른 해시를 낸다(dd5e1c73 · b63e6b5f —
      #     web-baseline.json). 고정 해시로 막을 수 없다. node-bench 는 기준선이 없으면 3(미판정).
      #   - **게이트는 렌주·NNUE 경로의 건전성이다** — 국면 5개를 1 스레드 고정 깊이로 두 빌드에
      #     읽혀, 필승은 같은 쪽 필승으로·점수는 평가 차 150 안으로 나와야 한다. 비트 동일은 요구하지
      #     않는다: AMD EPYC 9V74 러너(36715254077)에서 5개 중 1개가 반올림 차로 갈렸다(최선수는 같음).
      #     비트 차이는 경고로 남는다. relaxed 가 고장 나면(필승을 놓치거나 평가가 크게 튀면) 막는다.
      - name: relaxed BENCH (기록 — 판정 안 함)
        run: |
          grep -m1 "model name" /proc/cpuinfo || true
          node spike/node-bench.mjs single-simd128-relaxed || [ $? -eq 3 ]
      - name: relaxed 건전성 게이트 (렌주 · NNUE)
        run: node spike/relaxed-equivalence.mjs

      # 멀티 변형 관문 — 앱과 같은 구성(전용 워커 + pthread 가드)으로 chromium 에서
      # 기동·왕복·정지가 되는지. 실패하면 릴리스를 내지 않는다.
      - uses: pnpm/action-setup@v4
      - run: pnpm install --no-frozen-lockfile
      - name: 멀티 변형 관문 (W0c 하네스, chromium)
        env:
          BROWSERS: chromium
          # 첫 관문 런에서 페이지 구성이 멈춘 것은 하네스가 좌표 직후 곧바로 명령을
          # 보낸 입력 경합이었다(docs/W0c-결과.md 「입력 경합」) — 하네스에 앱과 같은
          # 정착 대기를 넣었으므로 두 구성 모두 관문으로 본다.
          W0C_REQUIRE: "multi:worker-pthread,multi:page"
        run: |
          pnpm exec playwright install --with-deps chromium
          node spike/w0c/run.mjs

      - name: emsdk 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WORK }}/emsdk
          key: emsdk-latest-v1

      - name: rapfi 소스 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WORK }}/rapfi
          key: rapfi-3c94c2a9-v1

      - name: 릴리스 본문
        run: |
          {
            echo "Rapfi WebAssembly 산출물 — multi/single × simd128/simd128-relaxed (앱이 환경을 보고 고른다)."
            echo "가중치는 모든 변형이 \`rapfi.data\` 하나를 쓴다(크기·SHA-256 은 \`engine-manifest.json\`)."
            echo
            echo '```'
            cat out/engine/ENGINE_VERSION.txt
            echo '```'
            echo
            echo "## 라이선스"
            echo
            echo "Rapfi 는 GPL-3.0-or-later 입니다. 이 자산은 그 엔진을 WebAssembly 로"
            echo "컴파일한 것이므로 같은 라이선스로 배포됩니다. 대응 소스는 upstream"
            echo "커밋 <https://github.com/dhbloo/rapfi/tree/3c94c2a9> 이고, 빌드에 쓴"
            echo "스크립트는 이 저장소의 \`tools/build_engine_wasm.sh\` 입니다 —"
            echo "엔진 소스에는 어떤 패치도 넣지 않았습니다."
            echo
            echo "가중치(\`.data\` 안에 구워짐)는 dhbloo/rapfi-networks 의 CC0 자료입니다."
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: 릴리스 발행
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          gh release delete "$TAG" --yes --cleanup-tag 2> /dev/null || true
          gh release create "$TAG" \
            --title "엔진 $TAG" \
            --notes-file RELEASE_NOTES.md \
            out/engine/rapfi-single-simd128.js \
            out/engine/rapfi-single-simd128.wasm \
            out/engine/rapfi-single-simd128-relaxed.js \
            out/engine/rapfi-single-simd128-relaxed.wasm \
            out/engine/rapfi-multi-simd128.js \
            out/engine/rapfi-multi-simd128.wasm \
            out/engine/rapfi-multi-simd128-relaxed.js \
            out/engine/rapfi-multi-simd128-relaxed.wasm \
            out/engine/rapfi.data \
            out/engine/engine-manifest.json \
            out/engine/ENGINE_VERSION.txt
          gh release view "$TAG" --json assets -q '.assets[] | "\(.name)  \(.size)"'

      # .js/.wasm 은 커밋 대상이다 — 릴리스에서 `gh release download` 로 받아
      # public/engine/ 에 넣는다. 아티팩트는 덤이고, 계정 저장 한도가 차 있으면
      # 올라가지 않으므로 잡을 깨지 않게 둔다.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: engine-committable
          path: |
            out/engine/rapfi-*.js
            out/engine/rapfi-*.wasm
            out/engine/engine-manifest.json
            out/engine/ENGINE_VERSION.txt
          if-no-files-found: error
