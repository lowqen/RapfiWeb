name: W0-3 진단 — BENCH 해시 폭

# W0-3 의 원인을 가르는 한 번짜리 실험. 자동으로 돌지 않는다(workflow_dispatch).
#
# 가설: wasm(4100a973) != 네이티브(e240ab16) 인데 노드 수는 같다는 사실은,
# benchmark.cpp 가 size_t 를 객체 표현 그대로 해시에 넣기 때문이다.
# wasm32 에서 size_t 는 4바이트, x86-64/arm64 에서는 8바이트다.
#
# 이 워크플로는 그 한 줄을 uint64_t 로 고정한 뒤 호스트와 wasm 을 각각 다시 굽고
# 해시가 같아지는지 본다. 같아지면 엔진은 처음부터 같은 답을 내고 있었던 것이다.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      WORK: ${{ github.workspace }}/../rapfi-wasm-work
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: 시스템 도구
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build ccache file

      # w0-spike.yml 과 **같은 키**. 있으면 쓰고, 없어도 스크립트가 스스로 갖춘다.
      - name: emsdk 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORK }}/emsdk
          key: emsdk-latest-v1

      - name: rapfi 소스 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORK }}/rapfi
          key: rapfi-3c94c2a9-v1

      - name: 진단 실행
        run: bash tools/diag_hash_width.sh

      - name: emsdk 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WORK }}/emsdk
          key: emsdk-latest-v1

      - name: rapfi 소스 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WORK }}/rapfi
          key: rapfi-3c94c2a9-v1

      - name: 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hash-width-diag
          path: results/
          if-no-files-found: warn

      - name: 요약
        if: always()
        run: |
          {
            echo "### W0-3 진단 — BENCH 해시 폭"
            echo
            echo '```json'
            cat results/hash-width-diag.json 2>/dev/null || echo "(결과 없음)"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
