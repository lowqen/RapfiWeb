name: 하드 필승 묶음 만들기 (mate-suite-hard)

# bench/sprt/make-hard-suite.mjs — SPRT 기보(bench/sprt/results/*.jsonl)에서 CI WASM 10~60초에 첫 +M 이 나오는
# 국면을 고른다. 1단계(네이티브)가 노드로 고르고, 2단계(WASM · 배포 구성)가 실제 시간을 재서 묶는다.
# 산출물 bench/gomocalc/mate-suite-hard.json 을 내려받아 커밋한다 — 그 뒤 mate-suite.yml 의 suite 로 쓴다.
on:
  workflow_dispatch:
    inputs:
      offsets:
        description: "판 끝에서 몇 수 앞(홀수 — 이긴 쪽 차례)"
        default: "11,15,19,23,27,31"
        type: string
      deep:
        description: "B 단계(최대 1,100만 노드)로 보낼 국면 수 — A2(180만 노드)를 거친 것 중에서"
        default: "800"
        type: string
      extra:
        description: "extract 에 더 줄 인자(진단 — 예: --limit-games 20 --verbose 40)"
        default: ""
        type: string
      verify:
        description: "2단계(WASM 확인 · 묶기)까지 돌릴지"
        default: true
        type: boolean
      max_out:
        description: "WASM 확인으로 보낼 최대 국면 수(국면당 최대 60초)"
        default: "90"
        type: string

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      WORK: ${{ github.workspace }}/../rapfi-wasm-work
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26"
      - name: 시스템 도구
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build ccache
      - name: rapfi 소스 캐시 복원
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.WORK }}/rapfi
          key: rapfi-3c94c2a9-v1
      - name: 네이티브 빌드(배포 구성의 탐색 — P2-2 는 1 스레드 결과 불변)
        run: OUT_DIR=bench/sprt/engines/base RAPFI_PATCHES=tools/patches/p2-2-keep-evaluators-on-rebuild.patch bash tools/build_host_engine.sh
      - name: 후보 고르기(A · B)
        run: |
          set -o pipefail
          grep -m1 "model name" /proc/cpuinfo || true
          E=bench/sprt/engines/base
          node bench/sprt/make-hard-suite.mjs extract --engine "$PWD/$E/pbrain-rapfi" --cwd "$E" --concurrency 2 \
            --offsets "${{ inputs.offsets }}" --deep "${{ inputs.deep }}" --max-out "${{ inputs.max_out }}" \
            ${{ inputs.extra }} --out hard-candidates.json | tee extract.log
          { echo '```'; grep -E '^\[|^→' extract.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: hard-candidates
          retention-days: 14
          path: |
            hard-candidates.json
            extract.log

  verify:
    needs: extract
    if: inputs.verify
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      WORK: ${{ github.workspace }}/../rapfi-wasm-work
      ENABLE_LTO: "ON"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: 시스템 도구
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build ccache file
      - name: emsdk 캐시 복원
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.WORK }}/emsdk
          key: emsdk-latest-v1
      - name: rapfi 소스 캐시 복원
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.WORK }}/rapfi
          key: rapfi-3c94c2a9-v1
      - name: WASM 빌드 — 배포 구성(P2-2 + -O4 --converge), BENCH 2b7c7da9 게이트
        run: |
          set -o pipefail
          RAPFI_PATCHES=tools/patches/p2-2-keep-evaluators-on-rebuild.patch WASM_OPT_POST="-O4 --converge" bash tools/build_engine_wasm.sh
          node spike/node-bench.mjs single-simd128 | grep -E '"(hash|nodes|pass)"'
          mkdir -p bench/gomocalc/engines/rapfiweb-base
          cp out/engine/rapfi-*.js out/engine/rapfi-*.wasm out/engine/rapfi-*.data out/engine/ENGINE_VERSION.txt bench/gomocalc/engines/rapfiweb-base/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hard-candidates
      - name: WASM 으로 60초씩 풀기 → 묶기
        run: |
          set -o pipefail
          grep -m1 "model name" /proc/cpuinfo || true
          ENGINES=rapfiweb-base SUITE=hard-candidates.json TIME_MS=60000 LABEL=hard-probe node bench/gomocalc/mate-probe.mjs | tail -40
          node bench/sprt/make-hard-suite.mjs finalize --candidates hard-candidates.json \
            --probe bench/gomocalc/results/hard-probe.json --out bench/gomocalc/mate-suite-hard.json | tee finalize.log
          { echo '```'; cat finalize.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mate-suite-hard
          retention-days: 14
          path: |
            bench/gomocalc/mate-suite-hard.json
            bench/gomocalc/results/hard-probe.*
            finalize.log
