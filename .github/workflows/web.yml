name: web

# W1 스캐폴딩부터 이 워크플로가 «빌드된다»를 지킨다.
# 엔진(WASM) 쪽 게이트는 w0-spike.yml 이 따로 본다 — 주기가 다르기 때문이다
# (웹은 매 푸시, 엔진은 커밋을 올릴 때).
on:
  push:
    paths-ignore:
      - "docs/**"
      - "spike/**"
      - "tools/**"
      - "bench/**"
      - ".github/workflows/w0-*.yml"
      - ".github/workflows/bench-*.yml"
      - ".github/workflows/n1-*.yml"
  pull_request:
  workflow_dispatch:

env:
  # 엔진 릴리스 — src/engine/engine-manifest.json 의 tag 와 같아야 한다(verify-engine.ts 가 본다).
  ENGINE_TAG: engine-3c94c2a9-w8

jobs:
  build:
    # 저장소 변수 CI_RUNNER(예: self-hosted)가 있으면 그 러너로 — GitHub 호스트 러너가 결제 · 지출 한도로 막혔을 때.
    # 변수를 지우면 ubuntu-latest 로 돌아간다.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 버전은 package.json 의 packageManager 필드에서 온다 — 여기 또 적으면 충돌한다.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm

      # 잠금 파일은 CI 가 만들어 준 것을 커밋해 두었다(이 저장소를 만든 기계에
      # Node 툴체인이 없어 직접 낼 수 없었다). --frozen-lockfile 로 조이는 것은
      # package.json 을 고칠 때 잠금 파일을 함께 갱신할 수 있게 된 다음이다.
      - run: pnpm install --no-frozen-lockfile

      - name: 잠금 파일 업로드 (커밋용)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock-generated
          path: pnpm-lock.yaml
          if-no-files-found: warn
          retention-days: 3

      - name: 타입
        run: pnpm typecheck

      - name: 린트
        run: pnpm lint

      - name: 단위 시험 (팔레트 골든 앵커 · 프로토콜)
        run: pnpm test

      - name: 프로덕션 빌드
        run: pnpm build

      # 「빌드가 됐다」와 「화면이 뜬다」는 다르다. 라우터 설정 오류, CSS 변수 오타,
      # 워커 URL 실수는 전부 빌드를 통과하고 빈 화면으로 끝난다. 그래서 이 단계가 있다.
      - name: Playwright(Chromium) 설치
        # --with-deps 는 apt(sudo)를 쓴다 — 안 되는 self-hosted 러너면 브라우저만 받는다.
        run: pnpm exec playwright install --with-deps chromium || pnpm exec playwright install chromium

      - name: 스모크 — AppShell 이 실제로 렌더되는가
        run: pnpm exec tsx scripts/smoke.ts

      # W9: 정석 — 판 · 글 입력, 갈래, 메모(마크다운 · 좌표 링크), 새로고침 뒤 남기, 뒤집은 판으로 찾기.
      - name: 정석 스모크 — 편집 · 저장 · 국면으로 찾기
        run: pnpm exec tsx scripts/joseki-smoke.ts

      # W7: 합성 .rif(RenjuNet 기보가 아니다 — 라이선스)를 보드에 떨어뜨려 변환 · 랭킹 · 오프닝 통계 ·
      # 대국 목록 · 새로고침 뒤 유지 · 지우기 → 내 기보 폴백까지.
      - name: W7 스모크 — .rif 드롭 · 변환 · 랭킹 · 오프닝 빈도
        run: pnpm exec tsx scripts/rif-smoke.ts

      # 엔진 산출물 조립. .js/.wasm 은 작아서 저장소에 두고 가중치(rapfi.data, 20MB — 모든
      # 변형 공유)는 릴리스에서 받는다(계획서 §8). 받은 뒤 커밋된 매니페스트·글루와 짝인지
      # 검증한다 — 어긋나면 배포된 앱의 가중치 무결성 검사가 모든 사용자에게서 실패한다.
      #
      # 「릴리스가 정말 없다」(release-download 코드 3)일 때만 엔진 스모크를 건너뛴다. 그 밖의 실패(gh 없음 ·
      # 인증 · 네트워크)는 실패로 — 예전에는 무엇이든 「없다」로 읽어 엔진 검사가 조용히 빠졌다(deploy.yml 주석).
      - name: 엔진 조립
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/engine
          # tools/ci/release-download.mjs — gh 가 없으면 REST(c4 러너). 종료 코드 3 = 릴리스가 정말 없다(그때만 건너뛴다).
          set +e
          node tools/ci/release-download.mjs "$ENGINE_TAG" dist/engine 'rapfi-*.js' 'rapfi-*.wasm' 'rapfi.data' 'engine-manifest.json'
          code=$?
          set -e
          if [ "$code" = 3 ]; then echo "릴리스가 아직 없습니다 — 엔진 스모크는 건너뜁니다."; exit 0; fi
          if [ "$code" != 0 ]; then echo "::error::엔진 릴리스 $ENGINE_TAG 를 받지 못했습니다(코드 $code)"; exit 1; fi
          echo '{ "type": "commonjs" }' > dist/engine/package.json
          ls -la dist/engine | sed 's/^/  /'
          pnpm exec tsx scripts/verify-engine.ts

      # 두 번 돈다: 격리(배포와 같은 COOP/COEP) → 멀티스레드 엔진이 떠야 하고,
      # 비격리(헤더를 못 붙이는 호스팅) → 단일 스레드로 물러서야 한다.
      - name: 엔진 스모크 — 클릭 -> 분석 -> 보드 (격리 · 멀티스레드)
        run: pnpm exec tsx scripts/engine-smoke.ts

      - name: 엔진 스모크 — 비격리 → 단일 스레드 폴백
        env:
          SMOKE_ISOLATE: "0"
        run: pnpm exec tsx scripts/engine-smoke.ts

      - name: 스모크 — 비격리 화면(스레드 선택 잠김)
        env:
          SMOKE_ISOLATE: "0"
        run: pnpm exec tsx scripts/smoke.ts

      # W4 부터: 분석이 아니라 **대국**을 돈다. 협상은 엔진이 실제로 무엇을
      # 말하는지가 답이라, 우리가 답을 만들어 넣는 단위 시험으로는 닿지 않는다.
      - name: 대국 스모크 — 협상·시계·기권까지 한 판
        run: pnpm exec tsx scripts/game-smoke.ts

      # W8: 진짜 엔진에 yixindb 를 붙이고 쓰고 저장한 뒤 새로고침해 다시 읽는다 — 메모리 FS
      # 왕복(w8 엔진의 FS 내보내기)과 한글 주석의 UTF-8 전선은 엔진이 실제로 답해야 드러난다.
      - name: DB 스모크 — 붙이기 · 쓰기 · 저장 · 새로고침 뒤 다시 붙기
        run: pnpm exec tsx scripts/db-smoke.ts

      # RenjuNet 오염 게이트. 이 저장소에서 가장 중요한 CI 단계다 —
      # 앱은 실수로 포함해도 기기에 머물지만, 웹은 그 순간 «온라인 시스템에 게시»가
      # 되어 라이선스를 바로 위반한다.
      - name: RenjuNet 오염 게이트
        run: |
          if find dist -iname '*.rif' -o -iname '*.pack' -o -iname 'freq_data.json' \
                       -o -iname 'renju*.sqlite' | grep -q .; then
            echo "::error::RenjuNet 파생 자료가 배포물에 있습니다 — 라이선스 위반. 중단."
            exit 1
          fi
          echo "깨끗합니다."

      - name: dist 업로드
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 3

      # 서식은 **맨 뒤**다. 들여쓰기 한 칸 때문에 진짜 고장(타입·시험·스모크)이
      # 가려지면 안 된다. 그리고 «틀렸다»고만 말하지 않고 고칠 패치까지 준다 —
      # 로컬에 Node 툴체인이 없는 환경에서도 받아서 그대로 적용할 수 있게.
      - name: 서식
        id: fmt
        if: always()
        run: |
          # **먼저 --check 로 묻는다.** 예전에는 곧장 --write 하고 `git diff` 가
          # 비었는지만 봤는데, 그러면 Prettier 와 무관한 변경까지 서식 실패로
          # 둔갑한다 — 실제로 pnpm 이 잠금 파일을 갱신했다는 이유로 빨갛게 났다.
          if pnpm exec prettier --check . > /dev/null 2>&1; then
            echo "서식 깨끗합니다."
            exit 0
          fi
          pnpm exec prettier --write . > /dev/null
          if ! git diff --quiet; then
            git diff > prettier.patch
            git diff --stat
            echo "----- 패치 전문 (아티팩트가 비어 나올 때를 대비해 로그에도 남긴다) -----"
            cat prettier.patch
            echo "----- 끝 -----"
            echo '::error::Prettier 가 고칠 것이 있습니다 — prettier-patch 아티팩트를 내려받아 git apply 하세요.'
            exit 1
          fi
          echo "서식 깨끗합니다."

      - name: 서식 패치 업로드
        if: always() && steps.fmt.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: prettier-patch
          path: prettier.patch
          if-no-files-found: ignore
          retention-days: 7
