name: W0c threads

# 스레드 조절 계획 1단계 — 멀티 변형(multi-simd128)이 **브라우저에서** 도는가.
#
# W0 에서 멀티 변형은 node 5/5, 헤드리스 Chromium 워커에서는 「기동은 되는데 전 단계
# 시간 초과」였다. 이 워크플로는 두 변형을 빌드하고 spike/w0c 하네스로
#   브라우저(chromium·firefox·webkit) × 실행 방식(페이지 / 워커 / 워커+글루 주소)
#   × 격리(COOP/COEP 있음·없음)
# 를 돌려 표 하나를 낸다. 결과(results/w0c.md)는 잡 요약에도 붙는다.
#
# 수동 실행만 한다. 멀티 변형은 아직 배포 경로가 아니므로 **릴리스에 올리지 않고**
# 아티팩트(14일)로만 낸다 — 로컬에서 같은 하네스를 다른 기계로 다시 재기 위해서다.
on:
  workflow_dispatch:
    inputs:
      browsers:
        description: "브라우저 (쉼표로)"
        default: "chromium,firefox,webkit"
        type: string

jobs:
  w0c:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WORK: ${{ github.workspace }}/../rapfi-wasm-work
      ENABLE_LTO: "ON"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm

      - name: 시스템 도구
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build ccache file
          nproc

      # w0-spike.yml · engine-release.yml 과 같은 키 — 2GB emsdk 를 다시 받지 않는다.
      - name: emsdk 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORK }}/emsdk
          key: emsdk-latest-v1

      - name: rapfi 소스 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORK }}/rapfi
          key: rapfi-3c94c2a9-v1

      - name: 빌드 (single + multi) + 검증 게이트
        run: bash tools/build_engine_wasm.sh

      - name: 멀티 변형 산출물
        run: ls -l out/engine | sed 's/^/  /'

      # 워커 조합이 왜 실패하는가 — 글루가 pthread 워커를 **무슨 주소로** 띄우는지.
      # (1차 런: 워커 · 워커+mainScriptUrlOrBlob 둘 다 첫 응답 없음)
      - name: 멀티 글루의 pthread 기동 경로
        run: |
          g=out/engine/rapfi-multi-simd128.js
          grep -o -E ".{0,80}(new Worker|mainScriptUrlOrBlob|_scriptName *=|em-pthread|ENVIRONMENT_IS_PTHREAD *=|scriptDirectory *=).{0,120}" "$g" | head -40 || true

      - run: pnpm install --no-frozen-lockfile

      - name: Playwright 브라우저
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: W0c 실험
        env:
          BROWSERS: ${{ inputs.browsers }}
        run: node spike/w0c/run.mjs

      - name: 요약
        if: always()
        run: |
          if [ -f results/w0c.md ]; then cat results/w0c.md >> "$GITHUB_STEP_SUMMARY"; fi
          echo "nproc: $(nproc)" >> "$GITHUB_STEP_SUMMARY"

      # 계정의 아티팩트 저장 한도에 걸리면 올라가지 않는다(1차 런) — 원자료는 위 실험
      # 단계 로그에도 찍으므로 여기 실패가 잡 전체를 빨갛게 만들지 않게 한다.
      - name: 결과 업로드
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: w0c-results
          path: results/
          if-no-files-found: warn
          retention-days: 30

      # 멀티 변형 엔진(.data 포함) — 로컬 재측정용. 가중치는 CC0(rapfi-networks)이다.
      - name: 엔진 업로드 (멀티 포함)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: w0c-engine
          path: |
            out/engine/rapfi-*-simd128.*
            out/engine/package.json
            out/engine/ENGINE_VERSION.txt
          if-no-files-found: warn
          retention-days: 14

      - name: emsdk 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WORK }}/emsdk
          key: emsdk-latest-v1
        continue-on-error: true

      - name: rapfi 소스 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WORK }}/rapfi
          key: rapfi-3c94c2a9-v1
        continue-on-error: true
