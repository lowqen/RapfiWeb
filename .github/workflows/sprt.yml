name: SPRT (네이티브 대국)

# bench/sprt/runner.mjs 로 네이티브 Rapfi 둘을 렌주 26개 표준 개시에서 쌍 대국시키고 SPRT 로 판정한다 —
# docs/최적화-마스터플랜.md Phase 3 의 「트리를 바꾸는 변경」 게이트. 탐색 변경은 네이티브(wasm 보다 2~4배 빠름)에서
# Elo 로 판정하고, 통과한 것만 wasm 으로 옮긴다(탐색 트리는 네이티브와 wasm 이 같다).
#
#   기준(B) = base_patches 를 얹은 빌드 · 시험(A) = base_patches + test_patches
#   둘 다 비우면 같은 엔진끼리의 자체 대국 — 러너 · 통계 스모크(결정이 나지 않아야 정상)
#
# ⚠ 비공개 저장소의 ubuntu-latest 는 논리 2개다. 대국은 한 번에 한 쪽만 생각하므로 동시 대국 2 가 맞다.
#   시간 제어가 짧을수록 러너 부하의 몫이 커진다 — 초속기 결과를 긴 시간 제어로 일반화하지 말 것.
on:
  workflow_dispatch:
    inputs:
      base_patches:
        description: "기준(B)에 얹을 패치(공백 구분 — 비우면 패치 없음)"
        default: ""
        type: string
      test_patches:
        description: "시험(A)에 base_patches 위로 더 얹을 패치(비우면 B 와 같은 엔진 — 자체 대국)"
        default: ""
        type: string
      test_config:
        description: "시험(A)의 config.toml 만 바꿀 것 — tools/config_set.mjs 의 \"표:키=값\"(쉼표로 여럿, 예: model.evaluator:margin_scale=300)"
        default: ""
        type: string
      games:
        description: "최대 판 수(쌍 단위)"
        default: "20"
        type: string
      tc:
        description: "시간 제어(runner.mjs --tc)"
        default: "turn=100"
        type: string
      tc_a:
        description: "시험(A)만의 시간 제어 — 비우면 tc(시간 핸디캡으로 러너를 검증할 때)"
        default: ""
        type: string
      tc_b:
        description: "기준(B)만의 시간 제어 — 비우면 tc"
        default: ""
        type: string
      openings_file:
        description: "개시 묶음 파일(예: bench/sprt/openings-balanced.json) — 비우면 26개 표준 3수 개시"
        default: ""
        type: string
      max_minutes:
        description: "대국 시간 예산(분) — 넘으면 시작한 쌍만 마저 두고 요약(잡 제한 360분 전에 끝내려고)"
        default: "330"
        type: string
      threads:
        description: "엔진마다 탐색 스레드(INFO THREAD_NUM). 2 이상이면 동시 대국 × 스레드 ≤ 논리 코어(러너 2)로"
        default: "1"
        type: string
      concurrency:
        description: "동시 대국 — auto 면 (물리 코어 − 2) ÷ 스레드(SMT 형제끼리 겹치지 않게, 러너 · 심판 몫을 남김)"
        default: "2"
        type: string
      engine:
        description: "대국 엔진 — native(pbrain-rapfi) 또는 wasm(bench/sprt/wasm-pbrain.mjs — 배포 실물. ISA 마다 속도가 다른 변경은 이것으로)"
        default: "native"
        type: choice
        options: ["native", "wasm"]
      wasm_variant:
        description: "engine=wasm 의 변형(단일 스레드만 — wasm-pbrain 은 sendCommand 동기 펌프)"
        default: "single-simd128-relaxed"
        type: string
      wasm_opt:
        description: "engine=wasm 의 wasm-opt 후처리(배포 구성 = -O4 --converge)"
        default: "-O4 --converge"
        type: string
      elo0:
        default: "0"
        type: string
      elo1:
        default: "5"
        type: string
      runner:
        description: "러너 — ubuntu-latest(논리 2) 또는 self-hosted(Vultr 전용 CPU — concurrency 를 코어 수에 맞춰)"
        default: "ubuntu-latest"
        type: choice
        options: ["ubuntu-latest", "self-hosted"]

permissions:
  contents: read

jobs:
  sprt:
    runs-on: ${{ inputs.runner }}
    # GitHub 호스트 러너는 잡 6시간 제한 — self-hosted 는 없으므로 max_minutes 를 더 길게 줄 수 있게 24시간까지.
    timeout-minutes: ${{ inputs.runner == 'self-hosted' && 1440 || 360 }}
    env:
      WORK: ${{ github.workspace }}/../rapfi-wasm-work
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: 시스템 도구
        # self-hosted 러너는 도구가 이미 있을 수 있고, sudo 에 암호가 걸려 있을 수 있다 — 있으면 건너뛰고,
        # 없으면 sudo -n(암호를 묻지 않고 바로 실패)으로 설치를 시도해 무엇이 없는지 분명히 말한다.
        run: |
          missing=()
          # wasm 은 emsdk 가 python3 · xz 를 쓴다
          for t in git cmake ninja g++ ccache pgrep python3 xz; do command -v "$t" > /dev/null || missing+=("$t"); done
          if [ ${#missing[@]} -eq 0 ]; then echo "도구 모두 있음"; exit 0; fi
          echo "없는 도구: ${missing[*]} — 설치 시도"
          sudo -n apt-get update -qq && sudo -n apt-get install -y git cmake ninja-build g++ ccache procps python3 xz-utils \
            || { echo "::error::설치 실패(sudo 암호?) — 러너 기계에 직접 설치: sudo apt-get install -y git cmake ninja-build g++ ccache procps python3 xz-utils"; exit 1; }

      - name: 러너 정보
        run: |
          echo "nproc $(nproc) · $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"
          grep -E 'MemTotal|MemAvailable' /proc/meminfo
          lscpu | grep -E '^(Thread|Core|Socket)' || true

      - name: rapfi 소스 캐시 복원
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.WORK }}/rapfi
          key: rapfi-3c94c2a9-v1

      - name: emsdk 캐시 복원
        if: inputs.engine == 'wasm'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.WORK }}/emsdk
          key: emsdk-latest-v1

      - name: 러너 · 통계 시험
        run: node --test bench/sprt/

      - name: 빌드 — 기준(B) · 시험(A)
        env:
          BASE: ${{ inputs.base_patches }}
          TEST: ${{ inputs.test_patches }}
          TEST_CONFIG: ${{ inputs.test_config }}
          KIND: ${{ inputs.engine }}
          V: ${{ inputs.wasm_variant }}
          OPT_PASSES: ${{ inputs.wasm_opt }}
        run: |
          set -o pipefail
          grep -m1 "model name" /proc/cpuinfo || true
          E=bench/sprt/engines
          if [ "$KIND" = "native" ]; then
            OUT_DIR=$E/base RAPFI_PATCHES="$BASE" bash tools/build_host_engine.sh
            OUT_DIR=$E/test RAPFI_PATCHES="$(echo $BASE $TEST)" bash tools/build_host_engine.sh
            if [ -n "$TEST_CONFIG" ]; then
              IFS=',' read -ra kv <<< "$TEST_CONFIG"
              node tools/config_set.mjs $E/test/config.toml "${kv[@]}"
            fi
            exit 0
          fi
          # ── wasm: 배포 실물(같은 변형 · 같은 wasm-opt)끼리. config 는 .data 에 구워져 test_config 를 쓸 수 없다.
          [ -z "$TEST_CONFIG" ] || { echo "::error::engine=wasm 에서는 test_config 를 쓸 수 없습니다(.data 에 구워짐)"; exit 1; }
          case "$V" in multi-*) echo "::error::wasm-pbrain 은 단일 스레드 변형만 — $V"; exit 1 ;; esac
          # 심판(금수 판정)은 네이티브 기준 빌드 — 판정 결과는 같고 훨씬 가볍다.
          OUT_DIR=$E/referee RAPFI_PATCHES="$BASE" bash tools/build_host_engine.sh
          take () {
            rm -rf "$E/$1"; mkdir -p "$E/$1"
            # package.json({"type":"commonjs"}) 이 없으면 저장소 루트의 "type": "module" 때문에 글루 .js 가 ESM 으로 읽힌다
            cp out/engine/rapfi-$V.js out/engine/rapfi-$V.wasm out/engine/rapfi-$V.data out/engine/ENGINE_VERSION.txt out/engine/package.json "$E/$1/"
            ( cd "$E/$1" && sha256sum rapfi-$V.wasm )
          }
          extra=""; case "$V" in single-simd128) ;; *) extra="$V" ;; esac
          RAPFI_PATCHES="$BASE" EXTRA_VARIANTS="$extra" WASM_OPT_POST="$OPT_PASSES" bash tools/build_engine_wasm.sh
          echo "--- B: BENCH single-simd128(배포 구성이면 2b7c7da9) · $V"
          node spike/node-bench.mjs single-simd128 | grep -E '"(hash|nodes|pass)"'
          node spike/node-bench.mjs "$V" | grep -E '"(hash|nodes|pass)"' || true
          take base
          RAPFI_PATCHES="$(echo $BASE $TEST)" EXTRA_VARIANTS="$extra" WASM_OPT_POST="$OPT_PASSES" bash tools/build_engine_wasm.sh
          echo "--- A: BENCH(트리를 바꾸는 변경이면 달라지는 것이 정상 — 기록만) · $V"
          node spike/node-bench.mjs "$V" | grep -E '"(hash|nodes|pass)"' || true
          take test

      - name: SPRT
        env:
          TC_A: ${{ inputs.tc_a }}
          TC_B: ${{ inputs.tc_b }}
          OPENINGS_FILE: ${{ inputs.openings_file }}
          KIND: ${{ inputs.engine }}
          V: ${{ inputs.wasm_variant }}
          CONC: ${{ inputs.concurrency }}
          THREADS: ${{ inputs.threads }}
        run: |
          set -o pipefail
          E=bench/sprt/engines
          per=()
          if [ -n "$TC_A" ]; then per+=(--a-tc "$TC_A"); fi
          if [ -n "$TC_B" ]; then per+=(--b-tc "$TC_B"); fi
          if [ -n "$OPENINGS_FILE" ]; then per+=(--openings-file "$OPENINGS_FILE"); fi
          if [ "$CONC" = "auto" ]; then
            # 대국마다 한 번에 한 엔진만 생각한다 — 생각하는 스레드가 물리 코어를 넘지 않게(SMT 형제를 나눠 쓰면 양쪽
            # 모두 느려져 시간 제어가 사실상 짧아진다), 러너 · 심판 · node GC 몫으로 2코어를 남긴다.
            #
            # 물리 코어는 **이 프로세스가 쓸 수 있는 CPU 안에서만** 센다. 컨테이너(RunPod 등)는 lscpu 에 호스트 전체가 보여,
            # 예전 셈은 CPU 32개짜리 컨테이너에서 「물리 128」로 동시 126판을 띄웠다 — 엔진마다 CPU 를 1/4 쯤 받아 수당 500ms 가
            # 실제로는 ~125ms 가 됐다(M3 sprt 37343543047, 무효). CPU 쿼터(cgroup v2 cpu.max)가 있으면 그 수가 상한이다.
            # 베어메탈은 허용 CPU 가 전부라 예전과 같은 값이다.
            allowed=$(awk '/^Cpus_allowed_list:/ {print $2}' /proc/self/status)
            phys=$(lscpu -p=CPU,Core,Socket | awk -F, -v list="$allowed" '
              BEGIN { n = split(list, r, ","); for (i = 1; i <= n; i++) { if (split(r[i], ab, "-") == 2) { for (c = ab[1] + 0; c <= ab[2] + 0; c++) ok[c] = 1 } else ok[r[i] + 0] = 1 } }
              /^#/ { next }
              ($1 + 0) in ok { print $2 "," $3 }' | sort -u | wc -l)
            quota=$(cat /sys/fs/cgroup/cpu.max 2> /dev/null || echo max)
            if [ "${quota%% *}" != "max" ]; then
              qcpu=$(( ${quota%% *} / ${quota##* } )); [ "$qcpu" -ge 1 ] || qcpu=1
              [ "$phys" -le "$qcpu" ] || phys=$qcpu
            fi
            CONC=$(( (phys - 2) / THREADS )); [ "$CONC" -ge 1 ] || CONC=1
            echo "동시 대국 auto → $CONC (쓸 수 있는 물리 코어 $phys · 허용 CPU $allowed · cpu.max $quota · 스레드 $THREADS)"
          fi
          if [ "$KIND" = "wasm" ]; then
            eng=(--a "node $PWD/bench/sprt/wasm-pbrain.mjs --dir $PWD/$E/test --variant $V" --a-name test
                 --b "node $PWD/bench/sprt/wasm-pbrain.mjs --dir $PWD/$E/base --variant $V" --b-name base
                 --referee "$PWD/$E/referee/pbrain-rapfi" --referee-cwd "$E/referee")
          else
            eng=(--a "$PWD/$E/test/pbrain-rapfi" --a-cwd "$E/test" --a-name test
                 --b "$PWD/$E/base/pbrain-rapfi" --b-cwd "$E/base" --b-name base)
          fi
          node bench/sprt/runner.mjs "${per[@]}" "${eng[@]}" \
            --games "${{ inputs.games }}" --tc "${{ inputs.tc }}" --concurrency "$CONC" --max-minutes "${{ inputs.max_minutes }}" --threads "$THREADS" \
            --elo0 "${{ inputs.elo0 }}" --elo1 "${{ inputs.elo1 }}" \
            --out sprt/games.jsonl --summary sprt/summary.json | tee sprt.log
          {
            echo "### SPRT — test(\`${{ inputs.base_patches }} ${{ inputs.test_patches }}\`) vs base(\`${{ inputs.base_patches }}\`)"
            echo '```'
            sed -n '/──────/,$p' sprt.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "--- 남은 pbrain 프로세스(0 이어야 함): $(pgrep -c pbrain-rapfi || true)"

      - name: 기보 · 요약
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sprt
          retention-days: 7
          path: |
            sprt/
            bench/sprt/engines/*/ENGINE_VERSION.txt
            bench/sprt/engines/*/bench.txt
