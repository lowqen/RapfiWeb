name: 톤 덤프 (Kotlin 기준값)

# 앱의 팔레트가 실제로 내는 값을 확정한다. 웹 이식이 그 값과 같은지 판정하는 기준이
# 되고, 산출물(src/core/design/tokens.golden.json)은 커밋해서 vitest 가 매번 대조한다.
#
# 수동 실행이다 — 램프 정의(hue/chroma)가 바뀔 때만 다시 돌리면 된다.
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 러너에 이미 JDK 가 있지만 버전을 고정해 둔다 — 부동소수 결과가 JDK 버전에
      # 좌우되지는 않지만, 재현할 때 무엇으로 돌렸는지는 남아야 한다.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: 덤프
        run: |
          java --version
          java tools/tone-dump/ToneDump.java > tokens.golden.json
          {
            echo "### 톤 덤프 — 검증점"
            echo
            echo '```'
            sed -n '/"anchors"/,/},/p' tokens.golden.json
            echo '```'
            echo
            echo "Color.kt 주석: Clay.tone(76) = #DAB673 · Clay.tone(42) = #7B5E22"
          } >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tokens-golden
          path: tokens.golden.json
          if-no-files-found: error
