name: 엔진 벤치 (gomocalc 대조)

# bench/gomocalc 하네스를 CI 러너에서 돌린다 — 잡음 없는 기계에서 재려고, 그리고 **같은
# 가중치**로 BENCH 를 대조하려고(배포 .data 는 렌주 전용이라 BENCH 국면 7/10 이 폴백 평가로
# 돈다 — 가중치 4종을 구운 우리 엔진이 필요하다).
#
# ⚠ 비공개 저장소의 ubuntu-latest 는 **논리 2개**(2026-09-29 실측, Xeon 8370C)다. 4 스레드는
#   초과 구독이라 스레드 확장은 물리 4코어 이상에서 따로 재야 한다(docs/gomocalc-엔진-비교.md §7).
#
#   rapfiweb       배포 중인 릴리스(렌주 전용 .data)
#   rapfiweb-full  같은 소스·같은 플래그 + 가중치 4종 + relaxed SIMD 멀티 변형 — 벤치 전용,
#                  배포·릴리스하지 않는다(.data 40.3MB 는 Cloudflare 25MB 상한 초과)
#   gomocalc       www.gomocalc.com/build 에 배포된 그대로
#
# 결과는 아티팩트가 아니라 **로그와 잡 요약**에 남긴다(아티팩트 저장 한도).
# 수동 실행이다.
on:
  workflow_dispatch:
    inputs:
      build_full:
        description: "rapfiweb-full(가중치 4종 + relaxed) 을 빌드해 함께 잴지"
        default: true
        type: boolean
      threads:
        description: "멀티 변형 스레드 수"
        default: "1,2,4"
        type: string
      time_ms:
        description: "국면당 탐색 시간(ms)"
        default: "10000"
        type: string
      repeat:
        description: "반복"
        default: "2"
        type: string
      patches:
        description: "Phase 2 패치 대조 — 주면 패치 없음 ↔ 패치를 이 러너에서 둘 다 빌드해 둘만 잰다(공백 구분)"
        default: ""
        type: string
      wasm_opt:
        description: "Phase 2 후처리 대조 — 주면 B 빌드의 .wasm 에 이 wasm-opt 패스를 얹는다(예: -O4 --converge)"
        default: ""
        type: string
      base_patches:
        description: "대조의 A·B 둘 다에 얹을 패치(배포 구성 위에서 잴 때 — 예: 채택된 P2-2). B 는 이것 + patches"
        default: ""
        type: string
      base_wasm_opt:
        description: "대조의 A·B 둘 다에 얹을 wasm-opt 패스(배포 구성 — -O4 --converge). wasm_opt 를 주면 B 는 그것"
        default: ""
        type: string
      patch_first:
        description: "대조에서 B(패치·후처리) 빌드를 먼저 잴지(두 번째 실행은 순서를 뒤집어 순서 편향을 지운다)"
        default: false
        type: boolean
      variants:
        description: "잴 변형(비우면 run.mjs 기본 — 없는 파일은 건너뛴다)"
        default: ""
        type: string

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      WORK: ${{ github.workspace }}/../rapfi-wasm-work
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: 엔진 받기 (gomocalc · 우리 릴리스)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node bench/gomocalc/fetch-engines.mjs

      - name: 시스템 도구
        if: inputs.build_full || (inputs.patches != '' || inputs.wasm_opt != '')
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build ccache file

      - name: emsdk 캐시 복원
        if: inputs.build_full || (inputs.patches != '' || inputs.wasm_opt != '')
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORK }}/emsdk
          key: emsdk-latest-v1

      - name: rapfi 소스 캐시 복원
        if: inputs.build_full || (inputs.patches != '' || inputs.wasm_opt != '')
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORK }}/rapfi
          key: rapfi-3c94c2a9-v1

      - name: 실험 빌드 — 가중치 4종 + relaxed SIMD
        if: inputs.build_full
        env:
          PRELOAD_SET: full
          EXTRA_VARIANTS: multi-simd128-relaxed
          ENABLE_LTO: "ON"
        run: |
          bash tools/build_engine_wasm.sh
          mkdir -p bench/gomocalc/engines/rapfiweb-full
          cp out/engine/rapfi-*.js out/engine/rapfi-*.wasm out/engine/rapfi-*.data out/engine/ENGINE_VERSION.txt \
             bench/gomocalc/engines/rapfiweb-full/
          ls -l bench/gomocalc/engines/rapfiweb-full
          # 보고서의 근거 — 컴파일·링크 줄에 실제로 무엇이 붙었는가
          for v in single-simd128 multi-simd128-relaxed; do
            nj="$WORK/rapfi/Rapfi/build-$v/build.ninja"
            echo "--- $v: FLAGS / LINK_FLAGS"
            grep -m1 -E "^\s+FLAGS = " "$nj" || true
            grep -m1 -E "^\s+LINK_FLAGS = " "$nj" | cut -c1-600 || true
          done

      # Phase 2 패치 대조(docs/최적화-마스터플랜.md 1부 §5.3 「결과 불변 변경」) — 배포 릴리스가 아니라
      # **이 러너에서 같은 툴체인으로** A(그대로)·B(패치 그리고/또는 wasm-opt 후처리) 두 빌드를 만들어
      # 그 둘만 잰다 — 엔진 이름은 rapfiweb-base(A) · rapfiweb-patch(B). 배포 렌주 구성
      # (PRELOAD_SET=renju) 그대로다. B 빌드는 BENCH 해시 게이트를 먼저 통과해야 한다.
      # base_patches·base_wasm_opt 를 주면 A 가 「그대로」가 아니라 그 구성(예: 배포 릴리스와 같은
      # P2-2 + -O4 --converge)이 되고, B 는 그 위에 patches 를 더한다 — 채택된 것 위에서 다음 것을 잰다.
      - name: 대조 빌드 — A(그대로·기준 구성) ↔ B(패치·후처리) (같은 러너 · 같은 툴체인)
        if: (inputs.patches != '' || inputs.wasm_opt != '')
        env:
          ENABLE_LTO: "ON"
          # 배포의 주력은 relaxed 변형이다 — 내적이 1연산이라 메모리 · 로드의 몫이 일반 판과 달라
          # 같은 패치의 이득도 다를 수 있다(A3). 대조에서도 relaxed 둘을 함께 빌드해 잰다.
          EXTRA_VARIANTS: "single-simd128-relaxed multi-simd128-relaxed"
          PATCHES: ${{ inputs.patches }}
          WASM_OPT_B: ${{ inputs.wasm_opt || inputs.base_wasm_opt }}
          BASE_PATCHES: ${{ inputs.base_patches }}
          BASE_WASM_OPT: ${{ inputs.base_wasm_opt }}
        run: |
          grep -m1 "model name" /proc/cpuinfo || true
          take () {
            mkdir -p "bench/gomocalc/engines/$1"
            cp out/engine/rapfi-*.js out/engine/rapfi-*.wasm out/engine/rapfi-*.data \
               out/engine/ENGINE_VERSION.txt "bench/gomocalc/engines/$1/"
            grep upstream "bench/gomocalc/engines/$1/ENGINE_VERSION.txt"
          }
          RAPFI_PATCHES="$BASE_PATCHES" WASM_OPT_POST="$BASE_WASM_OPT" bash tools/build_engine_wasm.sh
          take rapfiweb-base
          RAPFI_PATCHES="$(echo $BASE_PATCHES $PATCHES)" WASM_OPT_POST="$WASM_OPT_B" bash tools/build_engine_wasm.sh
          node spike/node-bench.mjs single-simd128   # 결과 불변 게이트 — 해시가 다르면 여기서 멈춘다
          take rapfiweb-patch

      - name: 벤치
        env:
          # 패치 대조면 두 빌드만(순서는 patch_first), 아니면 예전 구성.
          ENGINES: ${{ (inputs.patches != '' || inputs.wasm_opt != '') && (inputs.patch_first && 'rapfiweb-patch,rapfiweb-base' || 'rapfiweb-base,rapfiweb-patch') || (inputs.build_full && 'gomocalc,rapfiweb,rapfiweb-full' || 'gomocalc,rapfiweb') }}
          VARIANTS: ${{ inputs.variants || 'single-simd128,single-simd128-relaxed,multi-simd128,multi-simd128-relaxed' }}
          THREADS: ${{ inputs.threads }}
          TIME_MS: ${{ inputs.time_ms }}
          REPEAT: ${{ inputs.repeat }}
          BENCH: ${{ (inputs.patches != '' || inputs.wasm_opt != '') && 'single-simd128' || 'single-simd128,multi-simd128-relaxed' }}
          LABEL: ci
        run: |
          grep -m1 "model name" /proc/cpuinfo || true
          node bench/gomocalc/run.mjs

      - name: 요약
        if: always()
        run: |
          if [ -f bench/gomocalc/results/ci.json ]; then
            node bench/gomocalc/report.mjs bench/gomocalc/results/ci.json | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::group::results/ci.json"
            cat bench/gomocalc/results/ci.json
            echo "::endgroup::"
          fi
