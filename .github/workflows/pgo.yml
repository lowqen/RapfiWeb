name: WASM PGO (P3-5)

# tools/build_engine_wasm_pgo.sh — 계측 빌드 → Node 훈련(균형 개시 · 필승 묶음 표준 · 하드) → llvm-profdata merge →
# 프로파일 사용 빌드. 같은 러너에서 기준(배포 구성) ↔ PGO 를 1 스레드 NPS 로 두 번(순서 뒤집어) 잰다.
# 엔진 코드는 바꾸지 않는다(컴파일 · 링크 플래그뿐) — PGO 빌드는 BENCH 2b7c7da9 · 7,170,518 그대로여야 한다.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full = 전체(기준 · PGO · NPS) · diag = 계측 빌드 두 벌(이름 · 값 프로파일 끔)로 프로파일 꺼내기만 진단"
        default: "full"
        type: choice
        options: ["full", "diag"]
      train_nodes:
        description: "훈련 국면당 노드"
        default: "200000"
        type: string
      time_ms:
        default: "10000"
        type: string
      repeat:
        default: "2"
        type: string

permissions:
  contents: read

jobs:
  pgo:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      WORK: ${{ github.workspace }}/../rapfi-wasm-work
      ENABLE_LTO: "ON"
      RAPFI_PATCHES: tools/patches/p2-2-keep-evaluators-on-rebuild.patch
      WASM_OPT_POST: "-O4 --converge"
      BASE_VARIANTS: single-simd128
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: 시스템 도구
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build ccache file
      - name: emsdk 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORK }}/emsdk
          key: emsdk-latest-v1
      - name: rapfi 소스 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORK }}/rapfi
          key: rapfi-3c94c2a9-v1

      - name: 진단 — 프로파일 꺼내기(A 이름만 · B 이름 + 값 프로파일 끔), 각각 3국면 훈련
        if: inputs.mode == 'diag'
        run: |
          # 1차 진단(37171091827): 종료 때 값 프로파일 런타임(initializeValueProfRuntimeRecord)에서 OOB. 컴파일에만
          # -mllvm -disable-vp=true 를 준 빌드는 모듈 ID 까지 같았다 — LTO 라 계측 낮춤이 링크(wasm-ld) 때 돈다.
          # 그래서 링크에도 -Wl,-mllvm,-disable-vp=true 를 준다(C).
          # 2차(37171485247): 링크에도 -disable-vp 를 줬지만 모듈 ID 가 A · B 와 같았다 — 그 옵션은 IR 계측용이고 프런트엔드
          # 계측의 값 프로파일은 -enable-value-profiling 이 정한다(D). E 는 IR 계측(-fprofile-generate) + -disable-vp.
          # 모듈이 실제로 바뀌었는지 sha256 으로 확인한다.
          for v in D E; do
            if [ $v = D ]; then kind=fe; gen="-mllvm -enable-value-profiling=false"; genld="--profiling-funcs -Wl,-mllvm,-enable-value-profiling=false"
            else kind=ir; gen="-mllvm -disable-vp=true"; genld="--profiling-funcs -Wl,-mllvm,-disable-vp=true"; fi
            echo "================ 진단 $v — PGO_KIND=$kind PGO_GEN_CFLAGS='$gen' PGO_GEN_LDFLAGS='$genld'"
            PGO_KIND=$kind PGO_GEN_CFLAGS="$gen" PGO_GEN_LDFLAGS="$genld" PGO_TRAIN_LIMIT=3 PGO_TRAIN_NODES=20000 \
              PGO_STOP_AFTER_TRAIN=1 bash tools/build_engine_wasm_pgo.sh > diag-$v.log 2>&1 && echo "진단 $v: 성공" || echo "진단 $v: 실패"
            sha256sum "$WORK/pgo/inst/rapfi-single-simd128.wasm" | cut -c1-16 | sed 's/^/  계측 wasm sha256 /'
            grep -E "훈련 국면|\[pgo\]|RuntimeError|wasm-function|profraw|Total functions|Maximum function count|  X |PGO_STOP" diag-$v.log | head -40
          done

      - name: 기준 빌드 — 배포 구성(P2-2 + -O4 --converge), PGO 없음
        if: inputs.mode == 'full'
        run: |
          set -o pipefail
          grep -m1 "model name" /proc/cpuinfo || true
          bash tools/build_engine_wasm.sh
          node spike/node-bench.mjs single-simd128 | grep -E '"(hash|nodes|nodesPerSec|pass)"'
          mkdir -p bench/gomocalc/engines/rapfiweb-base
          cp out/engine/rapfi-single-simd128.* out/engine/ENGINE_VERSION.txt bench/gomocalc/engines/rapfiweb-base/

      - name: PGO — 계측 → 훈련 → merge → 사용 빌드
        if: inputs.mode == 'full'
        env:
          PGO_TRAIN_NODES: ${{ inputs.train_nodes }}
        run: |
          set -o pipefail
          bash tools/build_engine_wasm_pgo.sh 2>&1 | tee pgo-build.log
          echo "--- PGO 빌드 BENCH(2b7c7da9 · 7,170,518 이어야 함 — 다르면 여기서 멈춘다)"
          node spike/node-bench.mjs single-simd128 | grep -E '"(hash|nodes|nodesPerSec|pass)"'
          ls -l out/engine/rapfi-single-simd128.wasm bench/gomocalc/engines/rapfiweb-base/rapfi-single-simd128.wasm
          mkdir -p bench/gomocalc/engines/rapfiweb-pgo
          cp out/engine/rapfi-single-simd128.* out/engine/ENGINE_VERSION.txt bench/gomocalc/engines/rapfiweb-pgo/

      - name: 1 스레드 NPS — 기준 ↔ PGO, 순서 뒤집어 두 번
        if: inputs.mode == 'full'
        env:
          VARIANTS: single-simd128
          THREADS: "1"
          TIME_MS: ${{ inputs.time_ms }}
          REPEAT: ${{ inputs.repeat }}
          BENCH: single-simd128
        run: |
          grep -m1 "model name" /proc/cpuinfo || true
          ENGINES=rapfiweb-base,rapfiweb-pgo LABEL=pgo-run1 node bench/gomocalc/run.mjs
          ENGINES=rapfiweb-pgo,rapfiweb-base LABEL=pgo-run2 node bench/gomocalc/run.mjs
          for r in pgo-run1 pgo-run2; do
            node bench/gomocalc/report.mjs bench/gomocalc/results/$r.json > bench/gomocalc/results/$r.md
            { echo "### $r"; sed -n '/예열 뒤 NPS/,/^$/p;/내장 BENCH/,/^$/p' bench/gomocalc/results/$r.md; } >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pgo
          retention-days: 14
          path: |
            out/pgo/
            pgo-build.log
            diag-*.log
            bench/gomocalc/results/pgo-run*
            bench/gomocalc/engines/rapfiweb-*/ENGINE_VERSION.txt
